[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/rennerdo30/nitrate"
homepage = "https://nitrate.renner.dev"

# Workspace crates, exact versions: crates.io needs a version on every path
# dependency, and the four crates are always published together
# (docs/RELEASING.md). Bump these with the workspace version.
[workspace.dependencies]
nitrate-mpv = { path = "crates/nitrate-mpv", version = "=0.1.0-beta.1" }
nitrate-ui = { path = "crates/nitrate-ui", version = "=0.1.0-beta.1" }
nitrate-update = { path = "crates/nitrate-update", version = "=0.1.0-beta.1" }

# Fastest iteration (docs/BUILD.md):
# - workspace crates: incremental, small debug info, fast to relink;
# - dependencies: optimised once, no debug info, cached by sccache.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
# Unwinding stays on: a panicking worker is caught and reported, the window
# survives (AGENTS.md performance rule 8).
panic = "unwind"
strip = true

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
