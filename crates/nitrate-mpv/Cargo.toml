[package]
name = "nitrate-mpv"
description = "Loads libmpv at runtime and wraps the parts of its C API that Nitrate uses."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["mpv", "libmpv", "video", "ffi", "media"]
categories = ["multimedia::video", "api-bindings"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]

[dependencies]
libloading = "0.9.1"
