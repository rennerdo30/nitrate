[package]
name = "nitrate-ui"
description = "Nitrate's player controls: layout, hit testing and CPU drawing. No windowing, no GPU."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["media-player", "ui", "controls", "tiny-skia"]
categories = ["multimedia::video", "gui"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]

[dependencies]
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
fontdue = "0.9.5"
